name: publish-package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Approved tag to publish, for example v0.1.5"
        required: true
        type: string
      confirm_publish:
        description: "Type exactly: publish <tag>"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: startsWith(inputs.tag, 'v') && inputs.confirm_publish == format('publish {0}', inputs.tag)
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source_identity.outputs.commit }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"
      - name: Verify checkout is the approved tag
        id: source_identity
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${APV_TAG}^{commit}")"
          if [ "$head_sha" != "$tag_sha" ]; then
            echo "HEAD does not match refs/tags/${APV_TAG}" >&2
            exit 1
          fi
          echo "checkout matches refs/tags/${APV_TAG}: ${head_sha}"
          echo "commit=${head_sha}" >> "${GITHUB_OUTPUT}"
        env:
          APV_TAG: ${{ inputs.tag }}
      - name: Install build tools
        run: >-
          python -m pip install
          --require-hashes
          --only-binary=:all:
          -r .github/release-requirements.txt
      - name: Verify approved tag matches package version
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tomllib

          tag = os.environ["APV_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag/version mismatch: tag={tag!r}, expected={expected!r}")
          print(f"tag/version match: {tag}")
          PY
        env:
          APV_TAG: ${{ inputs.tag }}
      - name: Verify version is not already on PyPI
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          name = project["name"]
          version = project["version"]
          url = f"https://pypi.org/pypi/{name}/{version}/json"
          request = Request(url, headers={"User-Agent": "agent-personal-vault-release-check"})
          try:
              with urlopen(request, timeout=20):
                  raise SystemExit(f"PyPI already has {name}=={version}; stop before publish")
          except HTTPError as exc:
              if exc.code == 404:
                  print(f"PyPI does not have {name}=={version}")
              else:
                  raise
          PY
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Strict forbidden-file scan
        run: python scripts/scan_release_artifacts.py
      - name: Create canonical artifact bundle and approval manifest
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          python scripts/release_artifact_manifest.py create \
            --tag "${APV_TAG}" \
            --commit "${commit}"
          {
            echo "## Artifact manifest requiring environment approval"
            echo '```json'
            cat release-bundle/artifact-manifest.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          APV_TAG: ${{ inputs.tag }}
      - name: Upload canonical bundle for environment approval
        id: upload_bundle
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: approved-release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7
      - name: Record transferred bundle digest
        run: echo "GitHub artifact digest for approval${COLON} ${ARTIFACT_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_bundle.outputs.artifact-digest }}
          COLON: ':'

  publish:
    needs: build
    if: startsWith(inputs.tag, 'v') && inputs.confirm_publish == format('publish {0}', inputs.tag)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agent-personal-vault/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.14"
      - name: Download distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: approved-release-bundle
          path: release-bundle
      - name: Verify exact environment-approved artifact bytes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${APV_SOURCE_COMMIT}"
          python scripts/release_artifact_manifest.py verify \
            --tag "${APV_TAG}" \
            --commit "${APV_SOURCE_COMMIT}"
        env:
          APV_TAG: ${{ inputs.tag }}
          APV_SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: release-bundle/dist/
